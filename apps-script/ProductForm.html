<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function updateCalculation() {
            let price = parseFloat(document.getElementById('productPrice').value);
            let calculatedPrice = isNaN(price) ? '' : (price * 1.03).toFixed(2);
            document.getElementById('calculatedPrice').innerText = calculatedPrice ? `(${calculatedPrice})` : '';
        }

        function submitForm() {
            var product = {
                name: document.getElementById('productName').value.trim(),
                price: document.getElementById('productPrice').value.trim(),
                department: document.getElementById('productDepartment').value
            };

            if (!product.name || isNaN(parseFloat(product.price)) || !product.department) {
                alert("Please fill out all fields correctly.");
                return;
            }

            google.script.run.withSuccessHandler(successCallback)
                             .withFailureHandler(errorCallback)
                             .appendProduct(product);
        }

        function successCallback() {
            alert("Product successfully added!");
            google.script.host.close();
        }

        function errorCallback(error) {
            console.error("Error:", error.message);
            alert("Something went wrong and the product was not added.");
        }

        window.onload = function() {
            document.getElementById("submitBtn").addEventListener("click", submitForm);
            document.getElementById("productPrice").addEventListener("input", updateCalculation);
        };
    </script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white p-8 rounded-xl shadow-lg w-96">
        <label class="block text-gray-600 mb-1">Product Name:</label>
        <input type="text" id="productName" class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-200 mb-4" required>
        
        <label class="block text-gray-600 mb-1">Price:</label>
        <div class="flex items-center mb-4">
            <input type="number" id="productPrice" step="0.50" class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-200" required>
            <span id="calculatedPrice" class="ml-2 text-gray-500"></span>
        </div>
        
        <label class="block text-gray-600 mb-1">Department:</label>
        <select id="productDepartment" class="w-full px-3 py-2 border rounded-lg focus:ring focus:ring-blue-200 mb-4">
            <option value="" disabled selected>Select Department</option>
            <option value="Nutrition">Nutrition</option>
            <option value="Cosmetics">Cosmetics</option>
            <option value="Auto">Auto</option>
            <option value="Home">Home</option>
            <option value="Baby">Baby</option>
            <option value="Chips/Soda">Chips/Soda</option>
            <option value="Ingredients">Ingredients</option>
            <option value="Dairy">Dairy</option>
            <option value="Cleaning">Cleaning</option>
            <option value="Supplies">Supplies</option>
            <option value="Beverages">Beverages</option>
            <option value="Snacks">Snacks</option>
            <option value="Cereal">Cereal</option>
            <option value="Baking">Baking</option>
            <option value="Pasta/Soup">Pasta/Soup</option>
            <option value="Rice/Cans">Rice/Cans</option>
            <option value="Condiments">Condiments</option>
            <option value="Bread/Veggies">Bread/Veggies</option>
            <option value="Meat Products">Meat Products</option>
            <option value="Frozen Meals">Frozen Meals</option>
            <option value="Frozen Novelties">Frozen Novelties</option>
            <option value="Produce">Produce</option>
            <option value="Fresh Goods">Fresh Goods</option>
        </select>
        
        <button id="submitBtn" class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600">Submit</button>
    </div>
</body>
</html>
